name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Use synthetic data. Do not include credentials, account details, or private sessions.
    validations:
      required: true
  - type: input
    attributes:
      label: Version, operating system, and Node.js version
    validations:
      required: true
